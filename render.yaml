# ForeSightX — Render Blueprint (Free Tier)
# Deploy: push this repo to GitHub, then on https://render.com choose
# "New > Blueprint" and paste this repo. Render creates the backend API,
# Postgres, Redis, and serves the frontend as a static site.

databases:
  - name: foresightx-db
    databaseName: foresightx
    databaseUser: foresightx
    plan: free

  - name: foresightx-redis
    plan: free

services:
  # ---- Backend API (Node/Express) ----
  - type: web
    name: foresightx-backend
    runtime: docker
    buildContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MODEL_FORECAST_ENABLED
        value: "true"
      - key: MODEL_FORECAST_CITY
        value: bangalore
      - key: MODEL_FORECAST_LIVE
        value: "true"
      - key: MODEL_FORECAST_YEAR
        value: "2026"
      - key: CLIENT_ORIGIN
        sync: false
        value: https://foresightx-frontend.onrender.com
      # Postgres wiring
      - key: DB_HOST
        fromDatabase:
          name: foresightx-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: foresightx-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: foresightx-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: foresightx-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: foresightx-db
          property: password
      - key: DB_SSL
        value: "true"
      # Redis wiring
      - key: REDIS_URL
        fromDatabase:
          name: foresightx-redis
          property: connectionString
      # Optional live providers (SMS/email/weather). Leave blank/remove to
      # skip. NEVER commit real keys under version control.
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # ---- Frontend (static SPA, served on render.com) ----
  - type: web
    name: foresightx-frontend
    env: static
    rootDir: foresightx2
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point the browser at the backend API above.
      - key: VITE_API_BASE_URL
        value: https://foresightx-backend.onrender.com/api
      # Used for the built-in GenAI (Gemini) / Groq generative features.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false